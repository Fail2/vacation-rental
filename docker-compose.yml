services:
  postgres:
    build: .
    container_name: vacation-rental

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propertydb
  
    ports:
      - "5442:5432"
  
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
  
volumes:
  postgres_data:

